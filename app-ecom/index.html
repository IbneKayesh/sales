<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>ShopEasy - Online Shopping for Electronics, Clothing, Home & More</title>
    <meta name="title" content="ShopEasy - Online Shopping for Electronics, Clothing, Home & More" />
    <meta name="description" content="Shop the best deals on electronics, clothing, home goods, sports equipment, accessories and food. Free shipping on orders over $50. Easy returns and secure checkout." />
    <meta name="keywords" content="online shopping, electronics, clothing, home goods, sports, accessories, food, deals, free shipping" />
    <meta name="author" content="ShopEasy" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://shopeasy.com/" />
    <meta property="og:title" content="ShopEasy - Online Shopping for Electronics, Clothing, Home & More" />
    <meta property="og:description" content="Shop the best deals on electronics, clothing, home goods, sports equipment, accessories and food." />
    <meta property="og:image" content="https://shopeasy.com/og-image.jpg" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://shopeasy.com/" />
    <meta property="twitter:title" content="ShopEasy - Online Shopping for Electronics, Clothing, Home & More" />
    <meta property="twitter:description" content="Shop the best deals on electronics, clothing, home goods, sports equipment, accessories and food." />
    <meta property="twitter:image" content="https://shopeasy.com/og-image.jpg" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://shopeasy.com/" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://images.unsplash.com" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#2563eb" />
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ShopEasy",
      "url": "https://shopeasy.com/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://shopeasy.com/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
